<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリ紹介</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .app {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      flex-wrap: wrap; 
    }
    .app div {
      text-align: center;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 45%;
      margin-bottom: 20px;
    }
    .app img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
    }
    .app a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }
    .app a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>アプリ紹介ページ</h1>
    <div class="app">
      <div>
        <img src="bmiplus-icon.png" alt="bmiplus">
        <h2>bmiplus</h2>
        <p>健康管理をサポートするアプリです。</p>
        <a href="bmiplus.html">詳細を見る</a>
      </div>
      <div>
        <img src="todo-icon.jpg" alt="todo">
        <h2>Todo アプリ</h2>
        <p>タスク管理を簡単に行えるアプリです。</p>
        <a href="todo.html">詳細を見る</a>
      </div>
    </div>
  </div>
</body>
</html>
